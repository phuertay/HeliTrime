name: Build debug APK

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # third_party/rime is gitignored. CMake stops without these pins.
      - name: Fetch librime sources
        run: bash tools/fetch_rime_sources.bash

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # Actions artifacts are always zip files. A prerelease asset is the apk itself.
      - name: Publish the apk
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*-debug*.apk)
          test -f "$apk"
          name=$(basename "$apk")
          tag="v${name#Helitrime_}"
          tag="${tag%.apk}"
          notes="Debug build ${RELEASE_SHA}. Download ${name} directly. It is not inside a zip."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --notes "$notes" --target "$RELEASE_SHA" --prerelease
          else
            gh release create "$tag" "$apk" --prerelease --target "$RELEASE_SHA" --title "Helitrime ${tag#v}" --notes "$notes"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}"
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[${name}](${url})" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
